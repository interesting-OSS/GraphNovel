services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: graphnovel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-graphnovel123}
      POSTGRES_DB: graphnovel_db
    # PostgreSQL performance tuning
    command: >
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c max_connections=200
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c wal_buffers=16MB
      -c default_statistics_target=100
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphnovel -d graphnovel_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+asyncpg://graphnovel:${POSTGRES_PASSWORD:-graphnovel123}@db:5432/graphnovel_db
      REDIS_URL: redis://redis:6379/0
      LOG_FILE_PATH: /app/logs/app.log
    env_file:
      - .env.${APP_ENV:-production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - chroma_data:/app/chroma_data
      - ./logs:/app/logs
      - ./storage/generated_covers:/app/storage/generated_covers
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-serve
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  chroma_data:
