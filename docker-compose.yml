version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: langnovel
      POSTGRES_PASSWORD: langnovel123
      POSTGRES_DB: langnovel_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langnovel -d langnovel_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://langnovel:langnovel123@db:5432/langnovel_db
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - chroma_data:/app/chroma_data

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    command: celery -A celery_worker worker --loglevel=info --pool=threads --concurrency=4
    environment:
      DATABASE_URL: postgresql+asyncpg://langnovel:langnovel123@db:5432/langnovel_db
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - chroma_data:/app/chroma_data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-serve
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  chroma_data:
