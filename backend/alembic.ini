# =============================================================================
#  Alembic Database Migration Profile  ——  LangNovel Studio
# =============================================================================
#  使用方式：
#    cd backend
#    alembic revision --autogenerate -m "描述信息"
#    alembic upgrade head
#    alembic downgrade -1
# =============================================================================

[alembic]
# 迁移脚本存放目录
script_location = alembic

# 时间戳命名模板：20250622_1340_a1b2c3d4_添加用户表.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# 数据库连接串由 env.py 通过 app.config.settings 动态读取，
# 此处保留为离线生成 SQL 时的回退值
sqlalchemy.url = postgresql+asyncpg://langnovel:langnovel123@localhost:5432/langnovel_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
